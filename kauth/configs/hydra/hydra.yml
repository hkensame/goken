# 数据源配置（数据库连接信息）：
# 支持 MySQL 和 PostgreSQL，两者只能选其一。你当前使用的是 PostgreSQL。
# 示例格式：
#   - MySQL:    mysql://username:password@(host:port)/database?parseTime=true
#   - Postgres: postgres://username:password@host:port/database?sslmode=disable
dsn: postgres://ken:123@192.168.199.131:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4

# HTTP 服务配置：
serve:
  public:
    # Public API 服务监听的 IP 和端口，主要处理 OAuth2 的授权、token 请求等客户端接口
    host: 0.0.0.0       # 对所有网卡开放监听，方便容器或远程访问
    port: 4444          # Public 端口，默认是 4444
  admin:
    # Admin API 接口监听的地址，暴露管理接口（创建 client、token 失效等）
    host: 0.0.0.0
    port: 4445          # Admin 端口，默认是 4445

# 系统密钥配置，用于签发 JWT 等敏感加密操作：
secrets:
  system:
    - "thisisaverysecuresecretkey123456"
      # 必须至少16字符，建议32字符以上。
      # Hydra 用此密钥签发 access_token（如果开启 JWT 模式）、ID token 以及加密 session 等。

# 策略配置：
strategies:
  access_token: jwt
    # access_token 的颁发格式：
    # - "opaque"（默认）：只能通过 introspection endpoint 查询
    # - "jwt"：直接颁发可自验证的 JWT，无需 introspection，提高性能

# token 生命周期配置：
ttl:
  access_token: 1h        # access_token 有效期，1 小时
  refresh_token: 720h     # refresh_token 有效期，720 小时（30 天）
  id_token: 1h            # OpenID Connect 的 id_token，有效期 1 小时

# 各种 OAuth2 跳转相关 URL 配置：
urls:
  self:
    issuer: http://192.168.199.131:4444/
      # OAuth2 / OpenID Connect 的 "issuer" 字段，表示颁发者身份，必须是 public 端点地址。
      # 所有 token（特别是 ID Token）中都需要用到这个字段。
      # 注意不要少了最后的斜杠 `/`，否则可能验证失败。
  consent: http://192.168.199.131:3000/consent
    # 用户授权页面地址。当 OAuth2 流程中请求 scope 时，会跳转到此页面让用户同意授权。
    # 页面通常由你自己开发，需按照 Hydra 的 redirect 格式返回处理。
  login: http://192.168.199.131:3000/login
    # 用户登录页面地址。当用户还未登录或 session 失效时，Hydra 会跳转到此页面进行登录。
  logout: http://192.168.199.131:3000/logout
    # OAuth2 / OIDC 登出后跳转的页面，通常用户点击“登出”后会被重定向到此处。

# OAuth2 协议行为配置：
oauth2:
  expose_internal_errors: true
    # 若设为 true，当发生内部错误时，将返回具体错误信息（不建议生产开启，开发调试时可以用）。
  pkce:
    enforced: true
      # 是否强制要求使用 PKCE（Proof Key for Code Exchange），用于增强授权码流程的安全性
    enforced_for_public_clients: true
      # 是否对公共客户端（无 client_secret）强制使用 PKCE

# OpenID Connect 的 Subject Identifier 策略：
oidc:
  subject_identifiers:
    supported_types:
      - pairwise    # pairwise 模式下，Hydra 会对每个 Client 使用不同的 sub 标识（常用于保护隐私）
      - public      # public 模式下，所有 Client 共用同一个 sub
    pairwise:
      salt: youReallyNeedToChangeThis
        # 用于 pairwise subject identifier 的盐值。
        # 不同的 salt 会导致生成不同的 sub，确保加密一致性，必须设置为安全的随机值！

# 日志配置：
log:
  level: debug      # 日志等级：debug、info、warn、error
  format: json      # 日志输出格式：text 或 json